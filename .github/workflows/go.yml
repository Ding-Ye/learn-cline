name: go

on:
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "go.work"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "agents/**"
      - "go.work"
      - ".github/workflows/go.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        session:
          - s01-minimum-agent-loop
          - s02-streaming-message-parser
          - s03-tool-registry-execution
          - s04-approval-gating
          - s05-provider-streaming
          - s06-system-prompt
          - s07-file-edit-diff
          - s08-context-window-management
          - s09-mcp-integration
          - s10-checkpoints-shadow-git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: vet
        run: go vet ./...
        working-directory: agents/${{ matrix.session }}
      - name: build
        run: go build ./...
        working-directory: agents/${{ matrix.session }}
      - name: test
        run: |
          if [ -n "$(find . -name '*_test.go')" ]; then
            go test ./...
          else
            echo "no tests yet for ${{ matrix.session }}"
          fi
        working-directory: agents/${{ matrix.session }}
